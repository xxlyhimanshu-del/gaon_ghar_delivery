{% extends "base.html" %}{% block title %}Edit Product{% endblock %}{% block content %}<main class="container narrow top-space"><section class="card"><h1>Product Edit</h1><form method="POST" enctype="multipart/form-data"><label>Product naam<input name="name" value="{{ product.name }}" required></label><label>Price ₹<input type="number" name="price" value="{{ product.price }}" min="1" required></label><label>Shop naam<input name="shop_name" value="{{ product.shop_name }}" required></label><label>Category<input name="category" value="{{ product.category }}" required></label><label>Nayi photo optional<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp,image/*"></label><button>Save Changes</button> <a class="button secondary" href="{{ url_for('admin_products') }}">Cancel</a></form></section></main>{% endblock %}
